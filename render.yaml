services:
  - type: web
    name: robot-advisor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps the in-memory chat sessions consistent; threads handle concurrent users.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
